name: Daily Expense Reminder
on:
  schedule:
    # This runs at 15:30 UTC every day, which is 9:00 PM IST
    - cron: '30 15 * * *'
  workflow_dispatch: # This allows you to run it manually to test it!

jobs:
  send_email:
    runs-on: ubuntu-latest
    steps:
      - name: Send Mail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: mdhusdhndegree@gmail.com
          # This pulls the password from your GitHub Settings Secrets
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "⏱️ Time to log today's expenses!"
          to: mdhusdhndegree@gmail.com
          from: "FinTracker Pro"
          html_body: |
            <div style="background-color: #050505; padding: 60px 20px; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;">
              <div style="max-width: 480px; margin: 0 auto; background-color: #111520; border: 1px solid rgba(255,255,255,0.07); border-radius: 20px; padding: 48px 32px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);">
                
                <!-- Icon Header -->
                <div style="background: linear-gradient(135deg, #6366f1, #a855f7); width: 56px; height: 56px; line-height: 56px; border-radius: 16px; margin: 0 auto 24px; font-size: 28px; box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);">
                  💸
                </div>
                
                <!-- Main Content -->
                <h2 style="color: #ffffff; margin-top: 0; margin-bottom: 12px; font-size: 26px; font-weight: 700; letter-spacing: -0.5px;">Good Evening, Madhu!</h2>
                <p style="color: #94a3b8; font-size: 16px; line-height: 1.6; margin-bottom: 36px;">
                  Did you spend any money today? Take 30 seconds to log your expenses and keep your financial goals perfectly on track.
                </p>
                
                <!-- Action Button -->
                <a href="https://madhufinancetracker.netlify.app" style="display: inline-block; background-color: #6366f1; color: #ffffff; font-weight: 600; font-size: 16px; text-decoration: none; padding: 16px 32px; border-radius: 12px;">
                  Open Dashboard
                </a>
                
                <!-- Footer -->
                <p style="color: #475569; font-size: 13px; margin-top: 40px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 24px;">
                  Sent securely from your automated FinTracker Pro backend.
                </p>
                
              </div>
            </div>